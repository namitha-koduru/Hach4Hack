services:
  postgres:
    image: postgres:16-alpine
    container_name: teamforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: teamforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - teamforge-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: teamforge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/teamforge?schema=public"
      JWT_SECRET: "teamforge_production_secure_jwt_secret_key_min_32_characters_long"
      JWT_EXPIRES_IN: "7d"
      BCRYPT_SALT_ROUNDS: "10"
      CLIENT_ORIGIN: "http://localhost:3000"
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teamforge-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: teamforge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - teamforge-net

volumes:
  pgdata:
    driver: local

networks:
  teamforge-net:
    driver: bridge

