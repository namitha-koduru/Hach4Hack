name: TeamForge CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Build, Typecheck, Integration & Concurrency Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: teamforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/teamforge_test?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/teamforge_test?schema=public"
      JWT_SECRET: "ci_pipeline_super_secret_jwt_key_testing_only_32_chars"
      JWT_EXPIRES_IN: "1d"
      BCRYPT_SALT_ROUNDS: 6
      CLIENT_ORIGIN: "http://localhost:3000"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 10000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npm --workspace=backend run prisma:generate

      - name: Run Database Migrations (Schema Push)
        run: npx prisma db push --schema=backend/prisma/schema.prisma

      - name: Build Shared Package
        run: npm --workspace=shared run build

      - name: TypeScript Typecheck (Backend)
        run: npm --workspace=backend run build

      - name: TypeScript Typecheck & Build (Frontend)
        run: npm --workspace=frontend run build

      - name: Run Integration Test Suite (20+ Tests)
        run: npm --workspace=backend test -- tests/integration.test.ts

      - name: Run PS1 Race-Proof Concurrency Test (50 Concurrent Reqs vs 1 Seat)
        run: npm --workspace=backend run test:concurrency

      - name: Verify Seeder Execution
        run: npm --workspace=backend run seed

